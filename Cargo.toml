[package]
name = "cliarr"
version = "0.1.3"
edition = "2024"
rust-version = "1.88"
description = "A fast CLI/TUI for your home media stack"
license = "MIT"
repository = "https://github.com/ChrisThoma/cliarr"
homepage = "https://individuation.dev/projects/cliarr/"
readme = "README.md"
keywords = ["radarr", "sonarr", "plex", "tui", "self-hosted"]
categories = ["command-line-utilities"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "cookies", "rustls", "form", "query"] }
clap = { version = "4", features = ["derive", "env"] }
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui-image = { version = "11", default-features = false, features = ["image-defaults", "crossterm"] }
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
directories = "6"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
comfy-table = "7"
futures = "0.3"
url = "2"
rpassword = "7"
self-replace = "1"
semver = "1"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
wiremock = "0.6"
portable-pty = "0.9"

[profile.release]
lto = true
strip = true
